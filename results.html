<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results - Gorgias</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">GORGIAS</h1>
            <p class="subtitle">ANALYSIS RESULTS</p>
        </header>

        <div class="results-layout">
            <div class="results-container">
                <div id="analyzedText" class="analyzed-text">
                    <!-- Results will be inserted here by JavaScript -->
                </div>
            </div>

            <div class="markers-panel">
                <div class="markers-header">RHETORICAL DEVICES</div>
                <div id="markersList" class="markers-list">
                    <!-- Markers will be inserted here by JavaScript -->
                </div>
            </div>
        </div>

        <a href="index.html" class="back-link">Back to Home</a>
    </div>

    <!-- Modal -->
    <div id="markerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" class="modal-title"></h2>
                <span class="modal-close">&times;</span>
            </div>
            <div id="modalBody" class="modal-body">
                <!-- Modal content will be inserted here -->
            </div>
        </div>
    </div>

    <script type="module" src="results.js"></script>
</body>
</html>
